name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Cadence.xcodeproj \
            -scheme Cadence \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -E "error:" build.log | sort -u | head -60 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Cadence.app Payload/
          zip -qry Cadence.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-ipa
          path: Cadence.ipa
          retention-days: 30
